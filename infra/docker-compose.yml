version: '3.8'

services:
  # PostGIS Enabled Relational Database
  postgres:
    image: postgis/postgis:15-3.3
    container_name: swiftboda-postgis
    restart: always
    environment:
      POSTGRES_USER: swift_admin
      POSTGRES_PASSWORD: secure_swift_password
      POSTGRES_DB: swiftboda_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # In-Memory Cache & Realtime Spatial Geohash Index
  redis:
    image: redis:7-alpine
    container_name: swiftboda-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Node.js API Gateway & WebSocket Router
  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    container_name: swiftboda-gateway
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://swift_admin:secure_swift_password@postgres:5432/swiftboda_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: swiftboda-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

volumes:
  pgdata:
  redisdata:
