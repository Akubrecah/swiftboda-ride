apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftboda-gateway-deployment
  namespace: production
  labels:
    app: swiftboda-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swiftboda-gateway
  template:
    metadata:
      labels:
        app: swiftboda-gateway
    spec:
      containers:
      - name: gateway
        image: registry.swiftboda.com/swiftboda/gateway:v1.0.0
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: swiftboda-gateway-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 4000
  selector:
    app: swiftboda-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swiftboda-gateway-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swiftboda-gateway-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
